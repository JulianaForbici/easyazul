# Credenciais padrão para ambiente de desenvolvimento local
spring.datasource.url=jdbc:mysql://localhost:3306/easyazul_db?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configurações de comportamento do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Evita que a falha imediata de conexão derrube o contexto do Tomcat na subida
spring.datasource.hikari.initialization-fail-timeout=0

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-padrao-de-teste-123456}
