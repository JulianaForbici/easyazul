services:

  db:
    image: postgres:16-alpine
    container_name: easyazul-db
    environment:
      POSTGRES_DB: easyazul
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - easyazul_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d easyazul"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: easyazul-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/easyazul
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: 12345678
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: easyazul-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  easyazul_postgres: