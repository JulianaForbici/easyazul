<div class="page">
  <div class="layout">
        <!-- painel esquerdo -->
        <section class="side">
          <div class="brand">
            <div class="brand-title">Cadastre-se ao lado</div>
          </div>

          <div class="arrows" aria-hidden="true">
            <span class="arrow"></span>
            <span class="arrow"></span>
            <span class="arrow"></span>
            <span class="arrow"></span>
          </div>
        </section>

    <!-- card principal -->
    <section class="card">
      <div class="card-head">
        <div class="title">Criar conta</div>
        <div class="sub">Escolha o tipo e preencha seus dados</div>
      </div>

      <div class="toggle">
        <button type="button" class="seg" [class.active]="isPF" (click)="selecionarPF()">
          Pessoa Física
        </button>
        <button type="button" class="seg" [class.active]="isPJ" (click)="selecionarPJ()">
          Pessoa Jurídica
        </button>
      </div>

      <div class="alert" *ngIf="erroGeral">{{ erroGeral }}</div>

      <form #f="ngForm" (ngSubmit)="cadastrar(f)">
        <div class="grid">
          <div class="row">
            <label>Nome</label>
            <input name="nome" [(ngModel)]="form.nome" required />
          </div>

          <div class="row">
            <label>E-mail</label>
            <input name="email" [(ngModel)]="form.email" required type="email" />
          </div>

          <div class="row">
            <label>Senha</label>
            <input name="senha" [(ngModel)]="form.senha" required type="password" minlength="6" />
            <small class="help">Digite mais de 6 caracteres</small>
          </div>

          <div class="row">
            <label>Telefone</label>
            <input
              name="telefone"
              [(ngModel)]="form.telefone"
              required
              appMaskInput="telefone"
              placeholder="(47) 99999-9999"
            />
            <small class="help">Formato: (DD) 9xxxx-xxxx ou (DD) xxxx-xxxx</small>
          </div>

          <div class="row" *ngIf="isPF">
            <label>CPF</label>
            <input
              name="cpf"
              [(ngModel)]="form.cpf"
              required
              appMaskInput="cpf"
              placeholder="000.000.000-00"
            />
          </div>

          <div class="row" *ngIf="isPJ">
            <label>CNPJ</label>
            <input
              name="cnpj"
              [(ngModel)]="form.cnpj"
              required
              appMaskInput="cnpj"
              placeholder="00.000.000/0000-00"
            />
          </div>

          <div class="row" *ngIf="isPJ">
            <label>Razão Social</label>
            <input name="razaoSocial" [(ngModel)]="form.razaoSocial" required />
          </div>

          <div class="row">
            <label>Data nascimento (opcional)</label>
            <input
              name="dataNascimento"
              [(ngModel)]="form.dataNascimento"
              type="date"
              [min]="minNascimento"
              [max]="hoje"
            />
          </div>
        </div>

        <button class="btn" [disabled]="carregando || f.invalid">
          <span *ngIf="!carregando">Cadastrar</span>
          <span *ngIf="carregando">Cadastrando...</span>
        </button>

        <div class="link">
          <a class="#" routerLink="/login">Já tenho conta</a>
        </div>

      </form>
    </section>
  </div>
</div>
